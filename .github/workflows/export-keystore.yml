name: Export signing keystore (一次性备份)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: keystore
          key: dist-keystore-v1

      - name: Verify keystore exists
        run: |
          if [ ! -f keystore/debug.keystore ]; then
            echo "::error::缓存 dist-keystore-v1 已被驱逐，keystore 不存在，无法导出"
            exit 1
          fi
          echo "keystore 文件指纹："
          sha256sum keystore/debug.keystore

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore-backup
          path: keystore/debug.keystore
          retention-days: 1
          if-no-files-found: error
