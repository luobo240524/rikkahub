name: Custom Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'custom-2.5.6'
    # 纯文档/记忆/元数据提交不触发构建、不占用版本号(run_number 是全局计数器)
    # 混合提交(含代码/资源/构建脚本)仍会正常构建
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/**'
      - '.zcode/**'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: keystore
          key: dist-keystore-v1

      - name: Ensure signing keystore (Secrets 优先；两者皆缺即失败，绝不静默换签名)
        env:
          DIST_KEYSTORE_BASE64: ${{ secrets.DIST_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$DIST_KEYSTORE_BASE64" ]; then
            echo "$DIST_KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore
          fi
          if [ ! -f keystore/debug.keystore ]; then
            echo "::error::签名密钥缺失（Secrets DIST_KEYSTORE_BASE64 与缓存均无）。为避免换签名导致手机无法覆盖安装，本次构建终止。请用本地备份重新配置 Secret"
            exit 1
          fi
          {
            echo "storeFile=$GITHUB_WORKSPACE/keystore/debug.keystore"
            echo "storePassword=android"
            echo "keyAlias=androiddebugkey"
            echo "keyPassword=android"
          } > keystore.properties

      - name: Self-Check (Kotlin compile fast-fail)
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDistKotlin -PversionCode=${{ github.run_number }} -PversionName="2.5.6-r${{ github.run_number }}" --no-daemon --stacktrace

      - name: Gradle Build (dist)
        run: |
          chmod +x gradlew
          ./gradlew assembleDist -PversionCode=${{ github.run_number }} -PversionName="2.5.6-r${{ github.run_number }}" --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p apk
          for f in app/build/outputs/apk/dist/*.apk; do
            base=$(basename "$f" .apk)
            cp "$f" "apk/${base}-r${{ github.run_number }}.apk"
          done
          ls -la apk

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: custom-build
          name: Custom Build (multi-bubble)
          prerelease: true
          body: |
            自定义构建：消息分条功能（按助手开关）
            基于 RikkaHub v2.5.6，debug 签名，可与官方版共存。

            ---

            ## 致谢与开源声明（AGPL-3.0）
            本 APP 基于开源作品二次开发，感谢以下作者与项目（仅作署名致谢，未 @ 任何作者，不会打扰对方）：
            - 上游主项目：[rikkahub/rikkahub](https://github.com/rikkahub/rikkahub)（原作者 re-ovo，AGPL-3.0），本仓库源码同样以 AGPL-3.0 开源
            - 「一起听」功能参考 [NeteaseCloudMusicApi](https://github.com/Binaryify/NeteaseCloudMusicApi)（网易云音乐接口逆向）社区公开成果
            - 记忆库 MCP 服务端基于 [mem0ai/mem0](https://github.com/mem0ai/mem0) 开源项目搭建
            - 「宠物」玩法参考 [moonlin1213/cove-pet-nest](https://github.com/moonlin1213/cove-pet-nest)（Cove 灵宠屋，MIT）开源设计
            - 主要开源库：Jetpack Compose、Room、Coil、OkHttp、zxing、jlatexmath、QuickJS、lucide-icons 等（完整清单见仓库 gradle/libs.versions.toml）
            - 字体：方正仿宋 Z02S（方正免费字体）、Great Vibes（SIL OFL 许可）
          files: apk/*.apk
