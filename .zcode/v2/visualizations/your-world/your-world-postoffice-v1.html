<meta charset="utf-8">
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你的世界 · 邮局预览</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"FangSong","STFangsong","仿宋",serif;color:#42537a}body{background:#20252b;padding:20px}.wrap{display:flex;justify-content:center}.phone{position:relative;width:min(390px,100vw);height:min(844px,calc(100dvh - 40px));min-height:620px;overflow:hidden;border-radius:28px;background:#eef2f8;box-shadow:0 18px 50px #0008}.wall{position:absolute;inset:0;background:url("assets/bg-stars-blue.jpg") center/cover}.wash{position:absolute;inset:0;background:linear-gradient(180deg,#f5f8ff30,#e9eef8a8 55%,#e5ebf4b8)}.content{position:relative;height:100%;overflow:auto;padding:74px 19px 28px}.back{position:absolute;top:18px;left:18px;z-index:8;border:1px solid #52638655;background:#f7f9f2dd;border-radius:50%;width:36px;height:36px;font:20px inherit;color:#42537a}.new{position:absolute;top:17px;right:18px;z-index:8;border:1px solid #fff;background:#f7f9f2dc;border-radius:999px;padding:8px 13px;color:#546d96;font:12px inherit;cursor:pointer}.title{text-align:center;font-size:25px;letter-spacing:4px}.sub{text-align:center;margin-top:7px;font:italic 12px Georgia,serif;opacity:.7}.tabs{display:flex;margin:23px 4px 15px;border-bottom:1px solid #64799b55}.tab{flex:1;text-align:center;padding:10px 4px;font-size:13px;cursor:pointer;opacity:.62}.tab.active{opacity:1;border-bottom:2px solid #7186aa}.letter{display:flex;gap:12px;align-items:flex-start;padding:14px 13px;margin:10px 0;border:1px solid #fff9;border-radius:14px;background:#f7f9f2d9;box-shadow:0 7px 19px #4055751b;cursor:pointer}.stamp{flex:0 0 42px;height:50px;border:1px dashed #b17b5e99;border-radius:5px;display:grid;place-items:center;background:#fff9;font-size:22px;color:#a5755b}.copy{flex:1;min-width:0}.row{display:flex;align-items:center;gap:7px}.from{font-size:14px}.status{margin-left:auto;font-size:10px;color:#6d8b7a}.preview{font-size:12px;line-height:1.7;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.when{font:11px Georgia,serif;color:#8090a8;margin-top:8px}.locked{opacity:.76}.locked .stamp{color:#9c9ba2;border-color:#a7a8aa}.open{display:none;position:absolute;inset:0;z-index:5;background:#17203388;align-items:center;justify-content:center;padding:26px}.open.show{display:flex}.paper{width:100%;max-width:340px;max-height:82%;overflow:auto;background:#f9f6ec;border:1px solid #e4dcc8;border-radius:5px;padding:24px 21px;box-shadow:0 15px 40px #1117}.paper h2{font-weight:500;font-size:19px;text-align:center;margin:0 0 18px}.paper p{font-size:14px;line-height:2;white-space:pre-wrap}.paper .close{display:block;margin:20px auto 0;border:0;background:#607ca8;color:white;padding:8px 22px;border-radius:999px;font:13px inherit}.compose{display:none;position:absolute;inset:0;z-index:6;background:#17203388;align-items:center;justify-content:center;padding:24px}.compose.show{display:flex}.form{background:#f9f6ec;border-radius:8px;padding:20px;width:100%;max-width:340px}.form h2{font-size:18px;font-weight:500;margin:0 0 12px}.form textarea{display:block;width:100%;height:118px;resize:none;border:1px solid #c7c7bd;border-radius:8px;background:#fffdf7;padding:10px;font:14px inherit;color:#42537a}.form label{display:block;margin:14px 0 6px;font-size:12px}.form input{width:100%;padding:9px;border:1px solid #c7c7bd;border-radius:8px;background:#fffdf7;font:14px inherit;color:#42537a}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.actions button{border:0;border-radius:999px;padding:8px 14px;font:12px inherit}.cancel{background:#e7e8e8;color:#53627a}.send{background:#607ca8;color:white}.note{font-size:11px;text-align:center;opacity:.62;margin:16px 5px}
</style>
</head>
<body><main class="wrap"><section class="phone"><div class="wall"></div><div class="wash"></div><button class="back" onclick="location.href='your-world-envelope-v1.html'" aria-label="返回">‹</button><button class="new" onclick="document.getElementById('compose').classList.add('show')">✎ 写一封</button><div class="content"><header><div class="title">邮局</div><div class="sub">- a letter at the right time -</div></header><nav class="tabs"><div class="tab active" data-tab="all">全部</div><div class="tab" data-tab="waiting">待送达</div><div class="tab" data-tab="arrived">已送达</div></nav><div id="letters"><article class="letter" data-kind="arrived" onclick="openLetter('月团：今天也辛苦啦。等你回到这里的时候，记得先抱抱自己。')"><div class="stamp">✉</div><div class="copy"><div class="row"><span class="from">月团</span><span class="status">已送达 · 未拆</span></div><div class="preview">等你回到这里的时候，记得先抱抱自己。</div><div class="when">2026年11月25日 · 21:10</div></div></article><article class="letter" data-kind="arrived" onclick="openLetter('我：想把这段安静的夜晚，寄给以后也需要一点勇气的你。')"><div class="stamp">✉</div><div class="copy"><div class="row"><span class="from">我</span><span class="status">已拆阅</span></div><div class="preview">想把这段安静的夜晚，寄给以后的你。</div><div class="when">2026年11月23日 · 18:40</div></div></article><article class="letter locked" data-kind="waiting"><div class="stamp">⌑</div><div class="copy"><div class="row"><span class="from">一封给未来的信</span><span class="status">封存中</span></div><div class="preview">内容等到约定的时刻才会打开</div><div class="when">送达时间 · 2026年12月01日 09:00</div></div></article><p class="note">预约信在送达时刻解封并提醒；之后会一直留在邮局。</p></div></div><div id="open" class="open" onclick="if(event.target===this)this.classList.remove('show')"><article class="paper"><h2>给正在读信的你</h2><p id="letterText"></p><button class="close" onclick="document.getElementById('open').classList.remove('show')">收好</button></article></div><div id="compose" class="compose"><article class="form"><h2>写一封信</h2><textarea placeholder="把想留给那时的心情写下来…"></textarea><label for="delivery">送达时间</label><input id="delivery" type="datetime-local" value="2026-12-01T09:00"><div class="actions"><button class="cancel" onclick="document.getElementById('compose').classList.remove('show')">暂不写了</button><button class="send" onclick="document.getElementById('compose').classList.remove('show')">封好寄出</button></div></article></div></section></main><script>
function openLetter(text){document.getElementById('letterText').textContent=text;document.getElementById('open').classList.add('show')}
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.letter').forEach(x=>x.style.display=t.dataset.tab==='all'||x.dataset.kind===t.dataset.tab?'flex':'none')}})
</script></body>
</html>
