<meta charset="utf-8">
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你的世界 · 封面 v7(蓝色星空底图·草图要素)</title>
<link rel="stylesheet" href="assets/fonts/zcool-xiaowei/index.css">
<style>
  :root { font-size: 14px; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    background: #22231f; color: #e8e6ee;
    font-family: "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", system-ui, sans-serif;
    padding: 20px 24px 60px;
  }
  .toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; margin-bottom: 6px;
    background: #2c2d28; border-radius: 14px; border: 1px solid #3a3b36;
  }
  .toolbar h1 { font-size: 15px; font-weight: 700; }
  .toolbar .hint { font-size: 12px; color: #9a97a6; }
  .toolbar button {
    background: #6D8FB5; color: #fff; border: none; border-radius: 999px;
    padding: 7px 16px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .gallery { display: flex; gap: 26px; overflow-x: auto; padding-top: 18px; align-items: flex-start; }
  .shot { flex: 0 0 auto; }
  .shot .cap { text-align: center; font-size: 13px; color: #b9b6c6; margin-bottom: 8px; font-weight: 600; }

  .phone {
    width: 390px; height: 788px; border-radius: 30px; overflow: hidden;
    border: 1px solid #454651; position: relative;
    --text: #42537A; --sub: #7A8CAE; --faint: #9AA8C4;
    --line: rgba(110,140,190,.38);
    --line2: rgba(110,140,190,.22);
    --ring: rgba(255,255,255,.92);
    --hint: rgba(110,130,165,.85);
    --musicbg: rgba(255,255,255,.68);
    --sh: rgba(244,248,253,.85);
    background: #F4F8FD; color: var(--text);
  }
  .phone[data-theme="dark"] {
    --text: #D9E4F6; --sub: #9FB1CF; --faint: #7E90B0;
    --line: rgba(170,195,235,.30);
    --line2: rgba(170,195,235,.16);
    --ring: rgba(215,228,248,.42);
    --hint: rgba(159,177,207,.75);
    --musicbg: rgba(24,34,52,.62);
    --sh: rgba(10,16,28,.6);
    background: #10182A; color: var(--text);
  }
  /* 蓝色星空底图:整图直铺,顶对齐保住顶部吊坠串;暗色=multiply 深藏青罩层(压暗保蓝,近白图直接压亮度会变灰褐) */
  .bglayer {
    position: absolute; inset: 0; pointer-events: none;
    background: url(assets/bg-stars-blue.jpg) center top / cover no-repeat;
  }
  .veil { position: absolute; inset: 0; pointer-events: none; }
  .phone[data-theme="dark"] .veil { background: #101A36; mix-blend-mode: multiply; opacity: .84; }
  /* 边线:中段清晰,四角淡出,与图顶部吊串错开(顶线更淡) */
  .fl1 { position: absolute; inset: 16px; border: 1px solid var(--line); border-radius: 2px; pointer-events: none;
    -webkit-mask-image: radial-gradient(ellipse 92% 92% at 50% 50%, #000 58%, transparent 96%); opacity: .8; }
  .fl2 { position: absolute; inset: 23px; border: 1px solid var(--line2); border-radius: 1px; pointer-events: none;
    -webkit-mask-image: radial-gradient(ellipse 92% 92% at 50% 50%, #000 58%, transparent 96%); opacity: .8; }

  .music {
    position: absolute; top: 16px; right: 16px; width: 34px; height: 34px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--musicbg); border: 1px solid var(--line);
    cursor: pointer; z-index: 10; font-size: 14px; color: var(--sub);
    transition: transform .2s;
  }
  .music.on { color: #5C7FB8; animation: sway 2.8s ease-in-out infinite; }
  .phone[data-theme="dark"] .music.on { color: #A9C0E8; }
  @keyframes sway { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }

  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .wel { font-size: 17px; letter-spacing: 9px; text-indent: 9px; color: var(--sub); margin-top: 138px;
    text-shadow: 0 1px 10px var(--sh); }
  .ttl { font-size: 40px; letter-spacing: 8px; text-indent: 8px; margin-top: 10px; color: var(--text); line-height: 1.2;
    text-shadow: 0 2px 14px var(--sh); }
  .ava {
    width: 162px; height: 162px; border-radius: 50%; margin-top: 54px;
    background: radial-gradient(130% 130% at 32% 26%, #FFFFFF 0%, #EDF3FB 55%, #DCE7F5 100%);
    border: 3px solid var(--ring);
    box-shadow: 0 12px 30px rgba(92,127,184,.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 54px; color: #6C86B8;
    animation: glow 4.2s ease-in-out infinite;
  }
  .phone[data-theme="dark"] .ava {
    background: radial-gradient(130% 130% at 32% 26%, #31415E 0%, #293854 55%, #22304A 100%);
    color: #B5C8E8;
  }
  @keyframes glow {
    0%,100% { box-shadow: 0 12px 30px rgba(92,127,184,.22), 0 0 0 0 rgba(150,180,230,0); }
    50% { box-shadow: 0 12px 30px rgba(92,127,184,.22), 0 0 0 13px rgba(150,180,230,.16); }
  }
  .avaname { font-size: 19px; margin-top: 18px; letter-spacing: 5px; color: var(--text);
    text-shadow: 0 1px 10px var(--sh); }
  .sub3 { font-size: 11.5px; color: var(--text); opacity: .62; letter-spacing: 2px; margin-top: auto;
    text-shadow: 0 1px 8px var(--sh); }
  .myworld {
    margin-top: 30px; margin-bottom: 62px;
    font-family: "Segoe Script", "Brush Script MT", cursive;
    font-size: 21px; color: var(--text); opacity: .8;
    text-shadow: 0 1px 8px var(--sh);
  }
  .enterhint {
    position: absolute; left: 0; right: 0; bottom: 26px; text-align: center;
    font-size: 11px; letter-spacing: 3px; color: var(--hint); animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  .spark { position: absolute; color: var(--line); pointer-events: none; font-size: 13px; }
  .spark.s1 { left: 24%; top: 60%; } .spark.s2 { right: 20%; top: 64%; font-size: 10px; }
  .spark.s3 { left: 16%; top: 71%; font-size: 9px; opacity: .7; } .spark.s4 { right: 28%; top: 75%; }

  .f-fangsong .wel, .f-fangsong .ttl, .f-fangsong .avaname, .f-fangsong .ava {
    font-family: "FangSong", "STFangsong", "仿宋", serif;
  }
  .f-xiaowei .wel, .f-xiaowei .ttl, .f-xiaowei .avaname, .f-xiaowei .ava {
    font-family: "ZCOOL XiaoWei", serif;
  }
</style>
</head>
<body>

<div class="toolbar">
  <h1>你的世界 · 封面 v7</h1>
  <button onclick="toggleTheme()">亮 / 暗 切换</button>
  <span class="hint">新底图=蓝色星空吊坠(整图直铺顶对齐) · 草图要素:欢迎来到/我的世界/大头像/名称/-my world-收底 · A仿宋 / B站酷小薇</span>
</div>

<div class="gallery">

  <div class="shot">
    <div class="cap">A · 仿宋</div>
    <div class="phone f-fangsong" data-theme="light" id="p1">
      <div class="bglayer"></div>
      <div class="veil"></div>
      <div class="fl1"></div><div class="fl2"></div>
      <div class="music" onclick="this.classList.toggle('on')">♪</div>
      <div class="stage">
        <div class="wel">欢迎来到</div>
        <div class="ttl">我的世界</div>
        <div class="ava">雪</div>
        <div class="avaname">小雪</div>
        <div class="sub3">这里种着一座只属于你们的花园</div>
        <span class="spark s1">✦</span><span class="spark s2">✦</span>
        <span class="spark s3">✦</span><span class="spark s4">✦</span>
        <div class="myworld">- my world -</div>
      </div>
      <div class="enterhint">轻 触 任 意 处 · 进 入</div>
    </div>
  </div>

  <div class="shot">
    <div class="cap">B · 站酷小薇</div>
    <div class="phone f-xiaowei" data-theme="light" id="p2">
      <div class="bglayer"></div>
      <div class="veil"></div>
      <div class="fl1"></div><div class="fl2"></div>
      <div class="music" onclick="this.classList.toggle('on')">♪</div>
      <div class="stage">
        <div class="wel">欢迎来到</div>
        <div class="ttl">我的世界</div>
        <div class="ava">雪</div>
        <div class="avaname">小雪</div>
        <div class="sub3">这里种着一座只属于你们的花园</div>
        <span class="spark s1">✦</span><span class="spark s2">✦</span>
        <span class="spark s3">✦</span><span class="spark s4">✦</span>
        <div class="myworld">- my world -</div>
      </div>
      <div class="enterhint">轻 触 任 意 处 · 进 入</div>
    </div>
  </div>

</div>

<script>
  function toggleTheme() {
    document.querySelectorAll('.phone').forEach(function(p) {
      p.dataset.theme = p.dataset.theme === 'dark' ? 'light' : 'dark';
    });
  }
</script>
</body>
</html>
