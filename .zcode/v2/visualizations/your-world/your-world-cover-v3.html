<meta charset="utf-8">
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你的世界 · 封面预览 v3(水彩花园)</title>
<style>
  :root { font-size: 14px; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    background: #22231f; color: #e8e6ee;
    font-family: "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", system-ui, sans-serif;
    padding: 20px 24px 60px;
  }
  .toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; margin-bottom: 6px;
    background: #2c2d28; border-radius: 14px; border: 1px solid #3a3b36;
  }
  .toolbar h1 { font-size: 15px; font-weight: 700; }
  .toolbar .hint { font-size: 12px; color: #9a97a6; }
  .toolbar button {
    background: #7C9A6D; color: #fff; border: none; border-radius: 999px;
    padding: 7px 16px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .gallery { display: flex; gap: 26px; overflow-x: auto; padding-top: 18px; align-items: flex-start; }
  .shot { flex: 0 0 auto; }
  .shot .cap { text-align: center; font-size: 13px; color: #b9b6c6; margin-bottom: 8px; font-weight: 600; }

  .phone {
    width: 390px; height: 788px; border-radius: 30px; overflow: hidden;
    border: 1px solid #454651; position: relative;
    /* 淡绿花园 亮色 */
    --wash: linear-gradient(175deg, #F4F8EA 0%, #EAF2DC 40%, #E3EECF 72%, #DDE9C2 100%);
    --blob1: radial-gradient(circle at 30% 30%, rgba(214,232,186,.55), transparent 70%);
    --blob2: radial-gradient(circle at 70% 60%, rgba(202,224,170,.45), transparent 70%);
    --text: #3E4A36; --sub: #7C8B6E; --faint: #A5B295;
    --ring: rgba(255,255,255,.85);
    --hint: rgba(124,139,110,.75);
    --musicbg: rgba(255,255,255,.72);
    background: var(--wash); color: var(--text);
  }
  .phone[data-theme="dark"] {
    /* 夜色花园 */
    --wash: linear-gradient(175deg, #171E15 0%, #1C2618 45%, #212B1B 75%, #26331F 100%);
    --blob1: radial-gradient(circle at 30% 30%, rgba(90,120,70,.20), transparent 70%);
    --blob2: radial-gradient(circle at 70% 60%, rgba(70,100,60,.18), transparent 70%);
    --text: #DFE8D2; --sub: #9AA88B; --faint: #6C7A5E;
    --ring: rgba(223,232,210,.35);
    --hint: rgba(154,168,139,.6);
    --musicbg: rgba(30,40,26,.7);
    background: var(--wash); color: var(--text);
  }
  .deco { position: absolute; inset: 0; pointer-events: none;
    background-image: var(--blob1), var(--blob2); }

  .music {
    position: absolute; top: 52px; right: 18px; width: 38px; height: 38px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--musicbg); border: 1px solid rgba(124,139,110,.25);
    cursor: pointer; z-index: 10; font-size: 15px; color: var(--sub);
    backdrop-filter: blur(8px);
    transition: transform .2s;
  }
  .music.on { color: #5B8C4A; animation: sway 2.8s ease-in-out infinite; }
  .phone[data-theme="dark"] .music.on { color: #9CC98A; }
  @keyframes sway { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }

  .covercard {
    position: absolute; left: 50%; top: 47%; transform: translate(-50%,-50%);
    width: 356px; height: 472px;
    animation: floaty 6s ease-in-out infinite;
  }
  @keyframes floaty { 0%,100% { transform: translate(-50%,-50%); } 50% { transform: translate(-50%,-51.2%); } }
  .covercard .frameimg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; border-radius: 10px;
    box-shadow: 0 18px 44px rgba(60,80,45,.22), 0 4px 12px rgba(60,80,45,.12);
  }
  .phone[data-theme="dark"] .frameimg { filter: brightness(.62) saturate(.85); }
  .covercard .inner {
    position: absolute; left: 9%; right: 9%; top: 10%; bottom: 9%;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .wel { font-size: 12px; letter-spacing: 6px; text-indent: 6px; color: var(--sub); margin-top: 10px; }
  .ttl {
    font-family: "Source Han Serif SC", "Noto Serif SC", "STZhongsong", "SimSun", serif;
    font-size: 27px; font-weight: 700; letter-spacing: 5px; text-indent: 5px;
    margin-top: 7px; color: var(--text);
  }
  .ava-wrap { margin-top: 26px; position: relative; }
  .ava {
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(130% 130% at 32% 26%, #FFFDF4 0%, #EDF3DC 55%, #DFEAC4 100%);
    border: 3px solid var(--ring);
    box-shadow: 0 8px 22px rgba(80,105,60,.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 700; color: #6C8B5A;
    font-family: "Source Han Serif SC", "Noto Serif SC", "SimSun", serif;
    animation: glow 4.2s ease-in-out infinite;
  }
  .phone[data-theme="dark"] .ava {
    background: radial-gradient(130% 130% at 32% 26%, #3C4C33 0%, #33422B 55%, #2B3823 100%);
    color: #B9CDA0; border-color: var(--ring);
  }
  @keyframes glow {
    0%,100% { box-shadow: 0 8px 22px rgba(80,105,60,.18), 0 0 0 0 rgba(180,210,140,.0); }
    50% { box-shadow: 0 8px 22px rgba(80,105,60,.18), 0 0 0 9px rgba(180,210,140,.13); }
  }
  .avaname { font-size: 13.5px; font-weight: 600; margin-top: 10px; letter-spacing: 2px; color: var(--text); }
  .sub3 { font-size: 10.5px; color: var(--text); opacity: .55; margin-top: 5px; letter-spacing: 1px; }
  .myworld {
    margin-top: auto; margin-bottom: 16px;
    font-family: "Segoe Script", "Brush Script MT", cursive;
    font-size: 20px; color: var(--text); opacity: .78;
  }
  .enterhint {
    position: absolute; left: 0; right: 0; bottom: 22px; text-align: center;
    font-size: 11px; letter-spacing: 3px; color: var(--hint); animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
</style>
</head>
<body>

<div class="toolbar">
  <h1>你的世界 · 封面 v3(水彩花园)</h1>
  <button onclick="toggleTheme()">亮 / 暗 切换</button>
  <button onclick="toggleMusic()">♪ 音乐开关试听态</button>
  <span class="hint">草图对照:欢迎来到·我们的世界 / 头像+名称 / my world 花体 / 放轻动效 · 交互:点♪看播放态</span>
</div>

<div class="gallery">
  <div class="shot">
    <div class="cap">① 进入封面 · 绿框水彩花边(参考图同款底图)</div>
    <div class="phone" data-theme="light" id="p1">
      <div class="deco"></div>
      <div class="music" id="musicBtn" onclick="toggleMusic()">♪</div>
      <div class="covercard">
        <img class="frameimg" src="assets/frame-green.jpg" alt="">
        <div class="inner">
          <div class="wel">欢迎来到</div>
          <div class="ttl">我们的世界</div>
          <div class="ava-wrap">
            <div class="ava">雪</div>
          </div>
          <div class="avaname">小雪</div>
          <div class="sub3">这里种着一座只属于你们的花园</div>
          <div class="myworld">- my world -</div>
        </div>
      </div>
      <div class="enterhint">轻 触 任 意 处 · 进 入</div>
    </div>
  </div>
</div>

<script>
  function toggleTheme() {
    document.querySelectorAll('.phone').forEach(function(p) {
      p.dataset.theme = p.dataset.theme === 'dark' ? 'light' : 'dark';
    });
  }
  function toggleMusic() {
    document.getElementById('musicBtn').classList.toggle('on');
  }
</script>
</body>
</html>
