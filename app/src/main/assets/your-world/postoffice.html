<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/fonts/fzfangsong/font.css"><style>@font-face{font-family:'Segoe Script';src:url('assets/fonts/great-vibes.woff2') format('woff2');font-display:swap;}</style><!--world-fonts-injected--><title>邮局</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:FangSong,STFangsong,serif;color:#42537a}body{background:#edf2fa}.phone{position:relative;height:100%;overflow:hidden}.bg{position:absolute;inset:0;background:url('assets/bg-stars-blue.jpg') center/cover}.wash{position:absolute;inset:0;background:linear-gradient(180deg,#f5f8ff34,#e9eef8bf)}.back,.new{position:absolute;z-index:8;top:18px;border:1px solid #52638655;background:#f7f9f2dd;color:#42537a;font:14px FangSong}.back{left:18px;width:36px;height:36px;border-radius:50%;font-size:22px}.new{right:18px;border-radius:999px;padding:8px 13px}.body{position:relative;height:100%;overflow:auto;padding:74px 19px 28px}.title{text-align:center;font-size:26px;letter-spacing:4px}.sub{text-align:center;margin-top:7px;font:italic 12px Georgia,serif;opacity:.7}.tabs{display:flex;margin:23px 4px 15px;border-bottom:1px solid #64799b55}.tab{flex:1;text-align:center;padding:10px 4px;font-size:13px;opacity:.62}.tab.active{opacity:1;border-bottom:2px solid #7186aa}.letter{display:flex;gap:12px;align-items:flex-start;padding:14px 13px;margin:10px 0;border:1px solid #fff9;border-radius:14px;background:#f7f9f2d9;box-shadow:0 7px 19px #4055751b}.letter.locked{opacity:.73}.stamp{flex:0 0 42px;height:50px;border:1px dashed #b17b5e99;border-radius:5px;display:grid;place-items:center;background:#fff9;font-size:22px;color:#a5755b}.copy{flex:1;min-width:0}.row{display:flex;align-items:center;gap:7px}.who{font-size:14px}.status{margin-left:auto;font-size:10px;color:#6d8b7a}.preview{font-size:12px;line-height:1.7;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.when{font:11px Georgia,serif;color:#8090a8;margin-top:8px}.empty{text-align:center;margin:44px auto;font-size:13px;opacity:.65}.note{text-align:center;font-size:11px;opacity:.62;margin:16px 5px}.modal{display:none;position:absolute;inset:0;z-index:10;background:#17203388;align-items:center;justify-content:center;padding:24px}.modal.show{display:flex}.paper,.form{width:100%;max-width:340px;background:#f9f6ec;border-radius:7px;padding:21px;box-shadow:0 15px 40px #1117}.paper{max-height:82%;overflow:auto}.form{max-width:430px;height:min(86%,640px);display:flex;flex-direction:column;padding:18px;border-radius:10px}.paper h2,.form h2{font-weight:500;font-size:19px;text-align:center;margin:0 0 16px}.paper p{font-size:14px;line-height:2;white-space:pre-wrap}.form textarea{display:block;width:100%;flex:1;min-height:140px;height:auto;resize:none;border:1px solid #c7c7bd;border-radius:8px;background:#fffdf7;padding:12px;font:14px FangSong;line-height:1.85;color:#42537a}.draft{min-height:16px;margin-top:7px;text-align:right;font:10px system-ui;color:#8797ad}.form label{display:block;margin:14px 0 6px;font-size:12px}.form input{width:100%;padding:9px;border:1px solid #c7c7bd;border-radius:8px;background:#fffdf7;font:14px FangSong;color:#42537a}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.actions button,.paper button{border:0;border-radius:999px;padding:8px 15px;font:12px FangSong}.cancel{background:#e7e8e8;color:#53627a}.send,.paper button{background:#607ca8;color:#fff}
.phone{--panel:rgba(247,249,242,.85);--c-text:#42537a;--sh-text:0 1px 10px rgba(255,255,255,.55)}
.title,.sub,.note,.tabs,.tab,.empty{color:var(--c-text);text-shadow:var(--sh-text)}

</style></head><body><main class="phone"><div class="bg"></div><div class="wash"></div><button class="back">‹</button><button class="new">✎ 写一封</button><div class="body"><div class="title">邮局</div><div class="sub">- a letter at the right time -</div><nav class="tabs"><div class="tab active" data-kind="all">全部</div><div class="tab" data-kind="waiting">待送达</div><div class="tab" data-kind="arrived">已送达</div></nav><div id="letters"></div><div class="note">预约信在送达时刻解封并提醒；之后会一直留在邮局。</div></div><div id="read" class="modal"><article class="paper"><h2>给正在读信的你</h2><p id="readText"></p><button id="closeRead">收好</button></article></div><div id="compose" class="modal"><article class="form"><h2>写一封信</h2><textarea id="content" placeholder="把想留给那时的心情写下来…（会自动保存草稿）"></textarea><div class="draft" id="draftState"></div><label for="delivery">送达时间</label><input id="delivery" type="datetime-local"><div class="actions"><button class="cancel" id="cancel">暂不写了</button><button class="send" id="send">封好寄出</button></div></article></div></main><script>(function(){var AW=window.AndroidWorld;if(!AW)return;var letters=[];var draftTimer=0,composeEl=document.getElementById('compose'),contentEl=document.getElementById('content'),deliveryEl=document.getElementById('delivery'),draftEl=document.getElementById('draftState');
function setHint(t){if(draftEl)draftEl.textContent=t||''}
function persistDraft(){draftTimer=0;try{if(contentEl.value.trim()){AW.saveLetterDraft(contentEl.value,deliveryEl.value?new Date(deliveryEl.value).getTime():0);setHint('草稿已自动保存')}else{AW.clearLetterDraft();setHint('')}}catch(e){}}
function queueDraft(){if(draftTimer)clearTimeout(draftTimer);draftTimer=setTimeout(persistDraft,400)}
function restoreDraft(){var d={};try{d=JSON.parse(AW.getLetterDraft())||{}}catch(e){}if(!contentEl.value&&d.text){contentEl.value=d.text;if(d.scheduledAt){var dt=new Date(d.scheduledAt);deliveryEl.value=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16)}setHint('已找回上次没寄出的草稿')}}
function openCompose(){restoreDraft();composeEl.classList.add('show');setTimeout(function(){try{contentEl.focus()}catch(e){}},60)}
contentEl.addEventListener('input',queueDraft);deliveryEl.addEventListener('input',queueDraft);deliveryEl.addEventListener('change',queueDraft);window.addEventListener('pagehide',function(){if(draftTimer){clearTimeout(draftTimer);persistDraft()}});document.addEventListener('visibilitychange',function(){if(document.hidden&&draftTimer){clearTimeout(draftTimer);persistDraft()}});
function fmt(ts){return new Date(ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}function render(){var kind=document.querySelector('.tab.active').dataset.kind;var box=document.getElementById('letters');var list=letters.filter(function(x){return kind==='all'||(kind==='waiting'&&!x.due)||(kind==='arrived'&&x.due)});box.innerHTML=list.length?list.map(function(x){return '<article class="letter '+(x.due?'':'locked')+'" data-id="'+x.id+'"><div class="stamp">'+(x.due?'✉':'⌑')+'</div><div class="copy"><div class="row"><span class="who">'+x.who+'</span><span class="status">'+(x.due?(x.openedAt?'已拆阅':'已送达 · 未拆'):'封存中')+'</span></div><div class="preview">'+(x.due?x.text:'内容等到约定的时刻才会打开')+'</div><div class="when">'+(x.due?'送达 · '+fmt(x.scheduledAt||x.createdAt):'送达时间 · '+fmt(x.scheduledAt))+'</div></div></article>'}).join(''):'<div class="empty">这里还没有信件</div>';box.querySelectorAll('.letter[data-id]').forEach(function(el){el.onclick=function(){var x=letters.find(function(v){return String(v.id)===el.dataset.id});if(!x||!x.due)return;var s;try{s=JSON.parse(AW.openLetter(x.id))||{}}catch(e){s=null}if(s){try{var state=JSON.parse(AW.getState('postoffice'));letters=state.letters||letters}catch(e){}}document.getElementById('readText').textContent=x.text;document.getElementById('read').classList.add('show')}})}function pull(){try{var s=JSON.parse(AW.getState('postoffice'))||{};letters=s.letters||[]}catch(e){letters=[]}render()}document.querySelector('.back').onclick=function(){AW.back()};document.querySelector('.new').onclick=openCompose;document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x===t)});render()}});document.getElementById('closeRead').onclick=function(){document.getElementById('read').classList.remove('show');pull()};document.getElementById('cancel').onclick=function(){if(draftTimer){clearTimeout(draftTimer)}persistDraft();composeEl.classList.remove('show')};document.getElementById('send').onclick=function(){var text=contentEl.value.trim();if(!text){setHint('还没写内容呢');return}var raw=deliveryEl.value;var ts=raw?new Date(raw).getTime():0;var res='',ok=true;try{res=AW.addLetter(text,isNaN(ts)?0:ts)}catch(e){ok=false}if(ok){try{var o=JSON.parse(res);if(o&&o.error)ok=false}catch(e){if(!res)ok=false}}if(!ok){setHint('寄信失败，草稿已保住，再试一次');return}try{AW.clearLetterDraft()}catch(e){}contentEl.value='';deliveryEl.value='';setHint('');composeEl.classList.remove('show');pull()};var init=0;try{init=AW.getInitialLetterId()||0}catch(e){}pull();try{var d0=JSON.parse(AW.getLetterDraft())||{};if(d0.text)document.querySelector('.new').textContent='✎ 接着写'}catch(e){}if(init){setTimeout(function(){var el=document.querySelector('.letter[data-id="'+init+'"]');if(el)el.click()},120)}})();</script><script>(function(){var AW=window.AndroidWorld;var bg=document.querySelector('.bg');var phone=document.querySelector('.phone');if(!bg||!phone)return;
var WALLS=[{key:'stars',url:'assets/bg-stars-blue.jpg',pos:'center top'},{key:'butterfly',url:'assets/bg-butterfly-water.jpg',pos:'center'},{key:'bedroom',url:'assets/bg-bedroom-dream.jpg',pos:'center'},{key:'window',url:'assets/bg-window-butterfly.jpg',pos:'center'},{key:'seaside',url:'assets/bg-seaside-stairs.jpg',pos:'center'},{key:'lemon',url:'assets/bg-lemon-soda.jpg',pos:'center'},{key:'seawindow',url:'assets/bg-sea-window.jpg',pos:'center'}];
var HEAD={cx:.5,y0:.05,y1:.16,halfW:.42},LIST={cx:.5,y0:.30,y1:.82,halfW:.44};
var cache={};function loadImage(url){return new Promise(function(res,rej){if(cache[url])return res(cache[url]);var im=new Image();im.onload=function(){cache[url]=im;res(im)};im.onerror=rej;im.src=url})}
var scv=document.createElement('canvas');scv.width=60;scv.height=120;var sctx=scv.getContext('2d',{willReadFrequently:true});
function regionLum(im,r){sctx.drawImage(im,0,0,60,120);var x0=Math.round(60*(r.cx-r.halfW)),x1=Math.round(60*(r.cx+r.halfW)),y0=Math.round(120*r.y0),y1=Math.round(120*r.y1);var d=sctx.getImageData(Math.max(0,x0),y0,Math.max(1,x1-x0),Math.max(1,y1-y0)).data;var sum=0,n=0;for(var i=0;i<d.length;i+=4){sum+=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])/255;n++}return sum/n}
function tone(l){if(l>=.60)return{c:'#42537A',sh:'0 1px 10px rgba(255,255,255,.55)'};if(l>=.42)return{c:'#3A4A6E',sh:'0 1px 4px rgba(255,255,255,.9), 0 0 14px rgba(255,255,255,.65)'};return{c:'#F7FAFF',sh:'0 1px 8px rgba(20,35,70,.55), 0 0 12px rgba(20,35,70,.25)'}}
function alpha(l){if(l>=.62)return.50;if(l>=.42)return.62;return.74}
function mix(a,b,t){return a.map(function(v,k){return Math.round(v+(b[k]-v)*t)})}
function applyWall(w){bg.style.backgroundImage='url("'+w.url+'")';bg.style.backgroundPosition=w.pos;bg.style.backgroundSize='cover';
loadImage(w.url).then(function(im){var ht=tone(regionLum(im,HEAD));phone.style.setProperty('--c-text',ht.c);phone.style.setProperty('--sh-text',ht.sh);
sctx.drawImage(im,0,0,60,120);var ad=sctx.getImageData(0,0,60,120).data,ar=0,ag=0,ab=0;for(var i=0;i<ad.length;i+=4){ar+=ad[i];ag+=ad[i+1];ab+=ad[i+2]}var an=ad.length/4,avg=[Math.round(ar/an),Math.round(ag/an),Math.round(ab/an)];var paper=mix([255,255,255],avg,.15);phone.style.setProperty('--panel','rgba('+paper.join(',')+','+alpha(regionLum(im,LIST))+')')}).catch(function(){})}
function applySaved(){var w={};try{if(AW)w=JSON.parse(AW.getWall())||{}}catch(e){}var idx=0;WALLS.forEach(function(x,i){if(x.key===w.wallKey)idx=i});applyWall(WALLS[idx])}applySaved();})();</script></body></html>
