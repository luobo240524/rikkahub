<meta charset="utf-8">
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邮局</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:FangSong,STFangsong,serif;color:#42537a}body{background:#edf2fa}.phone{position:relative;height:100%;overflow:hidden}.bg{position:absolute;inset:0;background:url('assets/bg-stars-blue.jpg') center/cover}.wash{position:absolute;inset:0;background:linear-gradient(180deg,#f5f8ff34,#e9eef8bf)}.back,.new{position:absolute;z-index:8;top:18px;border:1px solid #52638655;background:#f7f9f2dd;color:#42537a;font:14px FangSong}.back{left:18px;width:36px;height:36px;border-radius:50%;font-size:22px}.new{right:18px;border-radius:999px;padding:8px 13px}.body{position:relative;height:100%;overflow:auto;padding:74px 19px 28px}.title{text-align:center;font-size:26px;letter-spacing:4px}.sub{text-align:center;margin-top:7px;font:italic 12px Georgia,serif;opacity:.7}.tabs{display:flex;margin:23px 4px 15px;border-bottom:1px solid #64799b55}.tab{flex:1;text-align:center;padding:10px 4px;font-size:13px;opacity:.62}.tab.active{opacity:1;border-bottom:2px solid #7186aa}.letter{display:flex;gap:12px;align-items:flex-start;padding:14px 13px;margin:10px 0;border:1px solid #fff9;border-radius:14px;background:#f7f9f2d9;box-shadow:0 7px 19px #4055751b}.letter.locked{opacity:.73}.stamp{flex:0 0 42px;height:50px;border:1px dashed #b17b5e99;border-radius:5px;display:grid;place-items:center;background:#fff9;font-size:22px;color:#a5755b}.copy{flex:1;min-width:0}.row{display:flex;align-items:center;gap:7px}.who{font-size:14px}.status{margin-left:auto;font-size:10px;color:#6d8b7a}.preview{font-size:12px;line-height:1.7;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.when{font:11px Georgia,serif;color:#8090a8;margin-top:8px}.empty{text-align:center;margin:44px auto;font-size:13px;opacity:.65}.note{text-align:center;font-size:11px;opacity:.62;margin:16px 5px}.modal{display:none;position:absolute;inset:0;z-index:10;background:#17203388;align-items:center;justify-content:center;padding:24px}.modal.show{display:flex}.paper,.form{width:100%;max-width:340px;background:#f9f6ec;border-radius:7px;padding:21px;box-shadow:0 15px 40px #1117}.paper{max-height:82%;overflow:auto}.paper h2,.form h2{font-weight:500;font-size:19px;text-align:center;margin:0 0 16px}.paper p{font-size:14px;line-height:2;white-space:pre-wrap}.form textarea{display:block;width:100%;height:118px;resize:none;border:1px solid #c7c7bd;border-radius:8px;background:#fffdf7;padding:10px;font:14px FangSong;color:#42537a}.form label{display:block;margin:14px 0 6px;font-size:12px}.form input{width:100%;padding:9px;border:1px solid #c7c7bd;border-radius:8px;background:#fffdf7;font:14px FangSong;color:#42537a}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.actions button,.paper button{border:0;border-radius:999px;padding:8px 15px;font:12px FangSong}.cancel{background:#e7e8e8;color:#53627a}.send,.paper button{background:#607ca8;color:#fff}
</style></head><body><main class="phone"><div class="bg"></div><div class="wash"></div><button class="back">‹</button><button class="new">✎ 写一封</button><div class="body"><div class="title">邮局</div><div class="sub">- a letter at the right time -</div><nav class="tabs"><div class="tab active" data-kind="all">全部</div><div class="tab" data-kind="waiting">待送达</div><div class="tab" data-kind="arrived">已送达</div></nav><div id="letters"></div><div class="note">预约信在送达时刻解封并提醒；之后会一直留在邮局。</div></div><div id="read" class="modal"><article class="paper"><h2>给正在读信的你</h2><p id="readText"></p><button id="closeRead">收好</button></article></div><div id="compose" class="modal"><article class="form"><h2>写一封信</h2><textarea id="content" placeholder="把想留给那时的心情写下来…"></textarea><label for="delivery">送达时间</label><input id="delivery" type="datetime-local"><div class="actions"><button class="cancel" id="cancel">暂不写了</button><button class="send" id="send">封好寄出</button></div></article></div></main><script>(function(){var AW=window.AndroidWorld;if(!AW)return;var letters=[];function fmt(ts){return new Date(ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}function render(){var kind=document.querySelector('.tab.active').dataset.kind;var box=document.getElementById('letters');var list=letters.filter(function(x){return kind==='all'||(kind==='waiting'&&!x.due)||(kind==='arrived'&&x.due)});box.innerHTML=list.length?list.map(function(x){return '<article class="letter '+(x.due?'':'locked')+'" data-id="'+x.id+'"><div class="stamp">'+(x.due?'✉':'⌑')+'</div><div class="copy"><div class="row"><span class="who">'+x.who+'</span><span class="status">'+(x.due?(x.openedAt?'已拆阅':'已送达 · 未拆'):'封存中')+'</span></div><div class="preview">'+(x.due?x.text:'内容等到约定的时刻才会打开')+'</div><div class="when">'+(x.due?'送达 · '+fmt(x.scheduledAt||x.createdAt):'送达时间 · '+fmt(x.scheduledAt))+'</div></div></article>'}).join(''):'<div class="empty">这里还没有信件</div>';box.querySelectorAll('.letter[data-id]').forEach(function(el){el.onclick=function(){var x=letters.find(function(v){return String(v.id)===el.dataset.id});if(!x||!x.due)return;var s;try{s=JSON.parse(AW.openLetter(x.id))||{}}catch(e){s=null}if(s){try{var state=JSON.parse(AW.getState('postoffice'));letters=state.letters||letters}catch(e){}}document.getElementById('readText').textContent=x.text;document.getElementById('read').classList.add('show')}})}function pull(){try{var s=JSON.parse(AW.getState('postoffice'))||{};letters=s.letters||[]}catch(e){letters=[]}render()}document.querySelector('.back').onclick=function(){AW.back()};document.querySelector('.new').onclick=function(){document.getElementById('compose').classList.add('show')};document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x===t)});render()}});document.getElementById('closeRead').onclick=function(){document.getElementById('read').classList.remove('show');pull()};document.getElementById('cancel').onclick=function(){document.getElementById('compose').classList.remove('show')};document.getElementById('send').onclick=function(){var text=document.getElementById('content').value.trim();if(!text)return;var raw=document.getElementById('delivery').value;var ts=raw?new Date(raw).getTime():0;try{AW.addLetter(text,isNaN(ts)?0:ts)}catch(e){}document.getElementById('content').value='';document.getElementById('compose').classList.remove('show');pull()};var init=0;try{init=AW.getInitialLetterId()||0}catch(e){}pull();if(init){setTimeout(function(){var el=document.querySelector('.letter[data-id="'+init+'"]');if(el)el.click()},120)}})();</script></body></html>
