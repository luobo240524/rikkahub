<meta charset="utf-8">
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留灯</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:FangSong,STFangsong,serif;color:#42537a}body{background:#edf2fa}.phone{position:relative;height:100%;overflow:hidden}.bg{position:absolute;inset:0;background:url('assets/bg-stars-blue.jpg') center/cover}.wash{position:absolute;inset:0;background:linear-gradient(180deg,#f5f8ff34,#e9eef8bf)}.back{position:absolute;z-index:4;top:18px;left:18px;width:36px;height:36px;border-radius:50%;border:1px solid #52638655;background:#f7f9f2dd;color:#42537a;font:22px FangSong}.body{position:relative;height:100%;overflow:auto;padding:76px 22px 28px}.title{text-align:center;font-size:27px;letter-spacing:4px}.sub{text-align:center;margin-top:7px;font:italic 12px Georgia,serif;opacity:.7}.rule{display:flex;gap:9px;align-items:center;margin:28px 2px 24px;font-size:12px;white-space:nowrap}.rule:before,.rule:after{content:"";border-top:1px dashed #61779b88;flex:1}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{position:relative;min-height:246px;border:1px solid #fff9;border-radius:15px;background:#f7f9f2ce;box-shadow:0 10px 25px #4a5b741b;padding:18px 14px 15px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center}.icon{width:66px;height:66px;display:grid;place-items:center;border-radius:50%;background:#fff9;font-size:34px;box-shadow:0 4px 14px #52638620}.card h2{font-weight:500;font-size:20px;margin:17px 0 6px}.en{font:italic 11px Georgia,serif;opacity:.58}.desc{font-size:12px;line-height:1.7;opacity:.78;margin-top:15px}.count{margin-top:auto;padding-top:12px;font-size:11px;color:#6880a4}.badge{position:absolute;right:10px;top:10px;border-radius:99px;background:#dca858;color:#fff;padding:3px 8px;font:10px system-ui}.foot{text-align:center;margin-top:27px;font-size:11px;opacity:.7}
</style></head><body><main class="phone"><div class="bg"></div><div class="wash"></div><button class="back">‹</button><div class="body"><div class="title">留灯</div><div class="sub">- words kept close -</div><div class="rule">把想说的话，放在这里</div><div class="cards"><div class="card" id="thought"><div class="icon">💭</div><h2>碎碎念</h2><div class="en">little whispers</div><div class="desc">此刻的心情，<br>一颗一颗收进词云</div><div class="count" id="thoughtCount">—</div></div><div class="card" id="letter"><span class="badge" id="pending">—</span><div class="icon">✉</div><h2>一份信</h2><div class="en">letters for later</div><div class="desc">写给未来的你们，<br>等约好的那天拆开</div><div class="count" id="letterCount">—</div></div></div><div class="foot">碎碎念随时可读 · 信件会在约定时刻送达</div></div></main><script>(function(){var AW=window.AndroidWorld;if(!AW)return;document.body.classList.add('appmode');document.querySelector('.back').onclick=function(){AW.back()};document.getElementById('thought').onclick=function(){AW.nav('thoughts')};document.getElementById('letter').onclick=function(){AW.nav('postoffice')};try{var s=JSON.parse(AW.getState('envelope'))||{};document.getElementById('thoughtCount').textContent=(s.thoughts||0)+' 条碎碎念';document.getElementById('letterCount').textContent=(s.letters||0)+' 封已送达';document.getElementById('pending').textContent=(s.pendingLetters||0)+' 封待送达'}catch(e){}})();</script></body></html>
